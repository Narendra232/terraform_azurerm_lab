name: Terraform DevSecOps CI-CD

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Enviroment/**'
      - 'azureresourses/**'
      - '.github/workflows/**'

  push:
    branches:
      - main
    paths:
      - 'Enviroment/**'
      - 'azureresourses/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  TF_VERSION: '1.9.8'
  TF_WORKING_DIR: './Enviroment/dev'

jobs:

  # ==========================================================
  # PR - DEVSECOPS CHECKS
  # ==========================================================

  terraform-security:
    name: Terraform DevSecOps Checks
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # TOOL CHECK
      # ======================================================

      - name: Check Terraform
        shell: powershell
        run: |
          terraform version

      - name: Check Azure CLI
        shell: powershell
        run: |
          az version

      - name: Check SonarScanner CLI
        shell: powershell
        run: |
          & "C:\sonar-scanner\bin\sonar-scanner.bat" --version

      - name: Check Gitleaks
        shell: powershell
        run: |
          gitleaks version

      - name: Check TFLint
        shell: powershell
        run: |
          tflint --version

      # ======================================================
      # AZURE LOGIN
      # ======================================================

      - name: Azure Login
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw "AZURE_CLIENT_ID secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) {
            throw "AZURE_CLIENT_SECRET secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw "AZURE_TENANT_ID secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            throw "AZURE_SUBSCRIPTION_ID secret is missing"
          }

          az login --service-principal `
            --username "$env:AZURE_CLIENT_ID" `
            --password "$env:AZURE_CLIENT_SECRET" `
            --tenant "$env:AZURE_TENANT_ID"

          az account set `
            --subscription "$env:AZURE_SUBSCRIPTION_ID"

          az account show

      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      # ======================================================
      # TERRAFORM FORMAT
      # ======================================================

      - name: Terraform Format Check
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # ======================================================
      # GITLEAKS
      # ======================================================

      - name: Gitleaks Secret Scan
        shell: powershell
        run: |
          gitleaks detect `
            --source . `
            --verbose `
            --redact

      # ======================================================
      # TFLINT
      # ======================================================

      - name: TFLint Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init

      - name: TFLint
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --format compact

      # ======================================================
      # TRIVY INSTALL
      # ======================================================

      - name: Install Trivy
        shell: powershell
        run: |

          $trivyDir = "C:\trivy"
          $trivyExe = "$trivyDir\trivy.exe"

          Write-Host "Checking Trivy installation..."

          if (-not (Test-Path $trivyExe)) {

            Write-Host "Trivy not found. Installing..."

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $trivyDir | Out-Null

            # Get latest Trivy release
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/aquasecurity/trivy/releases/latest"

            if (-not $release) {
              throw "Unable to retrieve latest Trivy release."
            }

            Write-Host "Latest Trivy release:"
            Write-Host $release.tag_name

            # Find Windows 64-bit ZIP
            $asset = $release.assets |
              Where-Object {
                $_.name -match "Windows-64bit.zip$"
              } |
              Select-Object -First 1

            if (-not $asset) {
              Write-Host "Available assets:"
              $release.assets | ForEach-Object {
                Write-Host $_.name
              }

              throw "Trivy Windows 64-bit ZIP was not found."
            }

            Write-Host "Trivy download URL:"
            Write-Host $asset.browser_download_url

            $zip = "$env:TEMP\trivy.zip"

            Write-Host "Downloading Trivy..."

            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -OutFile $zip

            if (-not (Test-Path $zip)) {
              throw "Trivy ZIP download failed."
            }

            Write-Host "Extracting Trivy..."

            Expand-Archive `
              -Path $zip `
              -DestinationPath $trivyDir `
              -Force

            Remove-Item `
              $zip `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $trivyExe)) {
            throw "Trivy installation failed. trivy.exe not found."
          }

          Write-Host "======================================"
          Write-Host "Trivy installed successfully"
          Write-Host "======================================"

          Write-Host "Trivy location:"
          Write-Host $trivyExe

          Write-Host "Trivy version:"
          & $trivyExe --version

          Add-Content `
            $env:GITHUB_PATH `
            $trivyDir

      # ======================================================
      # TRIVY IaC SCAN
      # ======================================================

      - name: Trivy IaC Scan
        shell: powershell
        run: |

          & "C:\trivy\trivy.exe" config . `
            --severity HIGH,CRITICAL `
            --exit-code 1 `
            --ignore-unfixed

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform plan `
            -input=false `
            -out=tfplan

      # ======================================================
      # SHOW PLAN
      # ======================================================

      - name: Show Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform show `
            -no-color `
            tfplan


  # ==========================================================
  # MAIN - TERRAFORM APPLY
  # ==========================================================

  terraform-apply:
    name: Terraform Apply

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64]

    # GitHub Environment Approval
    environment:
      name: prod

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # TOOL CHECK
      # ======================================================

      - name: Check Terraform
        shell: powershell
        run: |
          terraform version

      - name: Check Azure CLI
        shell: powershell
        run: |
          az version

      # ======================================================
      # AZURE LOGIN
      # ======================================================

      - name: Azure Login
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            throw "AZURE_CLIENT_ID secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) {
            throw "AZURE_CLIENT_SECRET secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
            throw "AZURE_TENANT_ID secret is missing"
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) {
            throw "AZURE_SUBSCRIPTION_ID secret is missing"
          }

          az login --service-principal `
            --username "$env:AZURE_CLIENT_ID" `
            --password "$env:AZURE_CLIENT_SECRET" `
            --tenant "$env:AZURE_TENANT_ID"

          az account set `
            --subscription "$env:AZURE_SUBSCRIPTION_ID"

          az account show

      # ======================================================
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform plan `
            -input=false `
            -out=tfplan

      # ======================================================
      # TERRAFORM APPLY
      # ======================================================

      - name: Terraform Apply
        shell: powershell
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform apply `
            -input=false `
            -auto-approve `
            tfplan